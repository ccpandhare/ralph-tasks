<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task Manager - Login">
    <meta name="author" content="Chinmay Pandhare">
    <title>Login - Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .central-auth-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .central-auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        .login-info {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        .login-info a {
            color: #667eea;
            text-decoration: none;
        }
        .login-info a:hover {
            text-decoration: underline;
        }
        /* Test section - hidden by default, shown only with ?test=1 */
        .test-section {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .test-section.visible {
            display: block;
        }
        .test-label {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Task Manager</h1>
        </div>
    </header>

    <main class="container">
        <div class="content-area login-container">
            <h2>Login</h2>

            <!-- Loading state (shown while checking auth / redirecting) -->
            <div id="loadingState" style="text-align: center; padding: 20px;">
                <div style="margin-bottom: 15px;">
                    <svg width="40" height="40" viewBox="0 0 40 40" style="animation: spin 1s linear infinite;">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="#667eea" stroke-width="3" stroke-dasharray="80" stroke-linecap="round"/>
                    </svg>
                </div>
                <p style="color: #666; margin: 0;">Redirecting to login...</p>
            </div>
            <style>
                @keyframes spin {
                    from { transform: rotate(0deg); }
                    to { transform: rotate(360deg); }
                }
            </style>

            <!-- Auth buttons (hidden initially, shown for test mode) -->
            <div id="authSection" style="display: none;">
                <button class="central-auth-btn" id="passkeyBtn" onclick="redirectToLogin()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a5 5 0 0 1 5 5v3H7V7a5 5 0 0 1 5-5z"/>
                        <rect x="3" y="10" width="18" height="12" rx="2"/>
                        <circle cx="12" cy="16" r="1"/>
                    </svg>
                    Login with Passkey
                </button>

                <p class="login-info">
                    Don't have an account? Contact an admin for an invite.
                </p>
            </div>

            <!-- Test Account Section - hidden by default, shown only with ?test=1 in URL -->
            <div class="test-section" id="testSection">
                <p class="test-label">E2E Test Account</p>
                <form id="loginForm">
                    <div class="form-group">
                        <input type="password" id="password" name="password" placeholder="Test password" required>
                    </div>
                    <div id="errorMessage" class="error-message"></div>
                    <button type="submit" class="btn btn-secondary" style="width: 100%;">Test Login</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Show test section and auth buttons only if ?test=1 is in URL (for E2E tests)
        // Otherwise, loading spinner is shown and auth.js will auto-redirect to central auth
        if (new URLSearchParams(window.location.search).get('test') === '1') {
            document.getElementById('testSection').classList.add('visible');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('loadingState').style.display = 'none';
        }
    </script>
    <script src="auth.js"></script>
</body>
</html>
