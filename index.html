<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task Manager - Manage your project tasks">
    <meta name="author" content="Chinmay Pandhare">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>Task Manager</h1>
            <button id="logoutBtn" class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="container">
        <div class="content-area">
            <!-- Primary Actions -->
            <div class="primary-actions">
                <div class="view-controls">
                    <button id="openTasksBtn" class="view-btn active" onclick="showOpenTasks()">Open Tasks</button>
                    <button id="completedTasksBtn" class="view-btn" onclick="showCompletedTasks()">Completed Tasks</button>
                </div>
                <a href="create-task.html" class="btn btn-primary">+ Create Task</a>
            </div>

            <!-- Compact Auto-Run Status -->
            <div class="auto-run-compact" id="autoRunStatus">
                <div class="auto-run-inline">
                    <span class="auto-run-icon">🤖</span>
                    <span class="auto-run-text">
                        <span id="executingStatus" class="auto-run-badge">...</span>
                        <span id="lastRunTime" class="auto-run-time">...</span>
                    </span>
                    <a href="ralph-auto.html" class="btn-link">View Auto-Run Logs →</a>
                </div>
                <button id="moreOptionsBtn" class="btn-text" onclick="toggleMoreOptions()">More Options ▾</button>
            </div>

            <!-- More Options Panel (Initially Hidden) -->
            <div class="more-options-panel hidden" id="moreOptionsPanel">
                <div class="options-grid">
                    <a href="logs.html" class="option-link">
                        <span class="option-icon">📋</span>
                        <span class="option-text">Progress Logs</span>
                    </a>
                    <a href="ralph-logs.html" class="option-link">
                        <span class="option-icon">🔍</span>
                        <span class="option-text">Ralph Execution Logs</span>
                    </a>
                    <button class="option-link" onclick="executeRalph()">
                        <span class="option-icon">▶️</span>
                        <span class="option-text">Run Ralph Once</span>
                    </button>
                    <button class="option-link" onclick="refreshAutoStatus()">
                        <span class="option-icon">🔄</span>
                        <span class="option-text">Refresh Status</span>
                    </button>
                </div>
            </div>

            <div id="taskList">
                <p class="loading">Loading tasks...</p>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="tasks.js"></script>
</body>
</html>
