<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task Manager - Manage your project tasks">
    <meta name="author" content="Chinmay Pandhare">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>Task Manager</h1>
            <button id="logoutBtn" class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="container">
        <div class="content-area">
            <div class="page-actions">
                <div class="view-controls">
                    <button id="openTasksBtn" class="view-btn active" onclick="showOpenTasks()">Open Tasks</button>
                    <button id="completedTasksBtn" class="view-btn" onclick="showCompletedTasks()">Completed Tasks</button>
                </div>
                <div class="action-buttons">
                    <a href="logs.html" class="btn btn-secondary">📋 View Logs</a>
                    <button id="ralphBtn" class="btn btn-ralph" onclick="executeRalph()">Run Ralph</button>
                    <a href="create-task.html" class="btn btn-primary">Create New Task</a>
                </div>
            </div>
            <div id="taskList">
                <p class="loading">Loading tasks...</p>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="tasks.js"></script>
</body>
</html>
